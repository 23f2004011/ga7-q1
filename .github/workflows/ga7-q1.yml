name: TDS GA7 Release Gate

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: TDS identity: 23f2004011@ds.study.iitm.ac.in
        run: echo "identity marker"

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install fastapi uvicorn httpx pytest

      - name: Run tests
        run: pytest test_release_gate.py
